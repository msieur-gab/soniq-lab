<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soniq Lab — Sonic Party</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Instrument+Serif&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #0e0e10; color: #e8e6e3;
    height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::after {
    content: '';
    position: fixed; inset: 0; z-index: 9999;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 256px 256px; opacity: 0.4;
  }

  .top-bar {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 24px; border-bottom: 1px solid #1e1e22;
  }
  .top-bar a { color: #6e6d6a; text-decoration: none; font-size: 13px; transition: color 0.2s; }
  .top-bar a:hover { color: #e8e6e3; }
  .top-bar h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 20px; flex: 1; }
  .top-bar .status { font-size: 12px; color: #6e6d6a; }

  .main { display: flex; height: calc(100vh - 57px - 56px); }

  /* --- Left: curve + controls --- */
  .left-panel {
    width: 480px; flex-shrink: 0;
    display: flex; flex-direction: column;
    border-right: 1px solid #1e1e22;
  }

  .controls-section {
    padding: 16px 20px; border-bottom: 1px solid #1e1e22;
  }
  .section-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    color: #6e6d6a; margin-bottom: 10px;
  }

  /* Genre hierarchy */
  .genre-tree { display: flex; flex-direction: column; gap: 2px; max-height: 180px; overflow-y: auto; }
  .genre-tree::-webkit-scrollbar { width: 4px; }
  .genre-tree::-webkit-scrollbar-track { background: transparent; }
  .genre-tree::-webkit-scrollbar-thumb { background: #2a2a2e; border-radius: 2px; }

  .genre-group {}
  .genre-parent {
    font-family: 'DM Sans', sans-serif; font-size: 12px;
    padding: 5px 10px; border-radius: 6px;
    background: none; border: 1px solid transparent;
    color: #6e6d6a; cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; gap: 8px; width: 100%;
  }
  .genre-parent:hover { color: #e8e6e3; }
  .genre-parent .arrow {
    font-size: 9px; transition: transform 0.2s; color: #4a4a4a; width: 10px;
  }
  .genre-parent.expanded .arrow { transform: rotate(90deg); }
  .genre-parent.active { color: #c4704b; }
  .genre-parent .gp-name { flex: 1; text-align: left; }
  .genre-parent .gp-count { font-size: 10px; color: #3a3a3a; }

  .genre-children {
    display: none; padding: 2px 0 4px 20px;
    flex-wrap: wrap; gap: 4px;
  }
  .genre-children.open { display: flex; }

  .genre-btn {
    font-family: 'DM Sans', sans-serif; font-size: 10px;
    padding: 3px 9px; border-radius: 10px;
    background: #1a1a1e; border: 1px solid #2a2a2e;
    color: #5a5a58; cursor: pointer; transition: all 0.15s;
  }
  .genre-btn:hover { border-color: #4a4a4e; color: #e8e6e3; }
  .genre-btn.active { background: rgba(196,112,75,0.15); border-color: #c4704b; color: #c4704b; }

  /* Sliders */
  .slider-row {
    display: flex; align-items: center; gap: 10px; margin-top: 8px;
  }
  .slider-label { font-size: 11px; color: #5a5a58; width: 50px; text-align: right; }
  .slider-val { font-size: 11px; color: #c4704b; width: 50px; font-variant-numeric: tabular-nums; }
  .slider-row input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 3px; background: #2a2a2e; border-radius: 2px; outline: none; cursor: pointer;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: #c4704b; cursor: pointer;
  }

  /* Canvas area */
  .curve-section {
    flex: 1; display: flex; flex-direction: column;
    padding: 16px 20px; min-height: 0;
  }
  .curve-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
  }
  .curve-header .section-label { margin-bottom: 0; flex: 1; }
  .curve-actions { display: flex; gap: 6px; }
  .curve-btn {
    font-family: 'DM Sans', sans-serif; font-size: 11px;
    padding: 4px 12px; border-radius: 6px;
    background: #1a1a1e; border: 1px solid #2a2a2e;
    color: #6e6d6a; cursor: pointer; transition: all 0.15s;
  }
  .curve-btn:hover { border-color: #4a4a4e; color: #e8e6e3; }
  .curve-btn.primary { background: rgba(196,112,75,0.15); border-color: #c4704b; color: #c4704b; }
  .curve-btn.primary:hover { background: rgba(196,112,75,0.25); }

  .canvas-wrap {
    flex: 1; position: relative; border-radius: 8px;
    background: #131316; border: 1px solid #1e1e22; overflow: hidden;
    cursor: crosshair;
  }
  .canvas-wrap canvas { width: 100%; height: 100%; display: block; }

  .y-labels {
    position: absolute; left: 6px; top: 0; bottom: 0;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 8px 0; pointer-events: none;
  }
  .y-labels span { font-size: 9px; color: #3a3a3a; }

  .presets { display: flex; gap: 6px; margin-top: 8px; }
  .preset-btn {
    font-family: 'DM Sans', sans-serif; font-size: 10px;
    padding: 3px 10px; border-radius: 10px;
    background: none; border: 1px solid #2a2a2e;
    color: #5a5a58; cursor: pointer; transition: all 0.15s;
  }
  .preset-btn:hover { border-color: #4a4a4e; color: #e8e6e3; }

  /* --- Right: playlist --- */
  .right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .results-header {
    padding: 16px 24px; border-bottom: 1px solid #1e1e22;
    font-size: 13px; color: #6e6d6a;
    display: flex; align-items: center; gap: 12px;
  }
  .results-header strong { color: #e8e6e3; font-weight: 500; }
  .results-count { margin-left: auto; font-size: 11px; color: #5a5a58; }

  .results-list { flex: 1; overflow-y: auto; padding: 4px 0; }

  .result-row {
    display: flex; align-items: center; gap: 14px;
    padding: 8px 24px; cursor: pointer; transition: background 0.15s;
  }
  .result-row:hover { background: rgba(255,255,255,0.02); }
  .result-row.playing { background: rgba(196,112,75,0.08); }
  .result-num {
    width: 24px; text-align: right; font-size: 12px; color: #4a4a4a;
    font-variant-numeric: tabular-nums; flex-shrink: 0;
  }
  .result-row.playing .result-num { color: #c4704b; }
  .result-info { flex: 1; min-width: 0; }
  .result-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-meta { font-size: 11px; color: #5a5a58; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-energy-bar {
    flex-shrink: 0; width: 48px; height: 20px;
    display: flex; align-items: flex-end; gap: 1px;
  }
  .energy-pip {
    flex: 1; background: #c4704b; border-radius: 1px; min-height: 2px;
    opacity: 0.6; transition: height 0.2s;
  }
  .result-tags {
    flex-shrink: 0; display: flex; gap: 3px;
  }
  .result-tag {
    font-size: 9px; padding: 1px 6px; border-radius: 8px;
    background: rgba(196,112,75,0.10); color: #8a6a5a;
  }
  .results-empty { padding: 60px 24px; text-align: center; color: #3a3a3a; font-size: 13px; line-height: 1.8; }

  /* --- Player --- */
  .player-bar {
    display: flex; align-items: center; gap: 12px;
    height: 56px; padding: 0 24px;
    border-top: 1px solid #1e1e22; background: #141416;
  }
  .player-btn {
    background: none; border: none; cursor: pointer;
    color: #888; padding: 4px; transition: color 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .player-btn:hover { color: #e8e6e3; }
  .player-btn svg { width: 20px; height: 20px; fill: currentColor; }
  .player-btn.play-btn svg { width: 24px; height: 24px; }
  .player-track-info { flex: 1; min-width: 0; }
  .player-track-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-track-meta { font-size: 11px; color: #5a5a58; margin-top: 1px; }
  .player-seek {
    flex: 1; max-width: 280px; -webkit-appearance: none; appearance: none;
    height: 3px; background: #2a2a2e; border-radius: 2px; outline: none; cursor: pointer;
  }
  .player-seek::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #c4704b; cursor: pointer; }
  .player-time { font-size: 11px; color: #5a5a58; font-variant-numeric: tabular-nums; min-width: 80px; text-align: right; }
  .player-idle { font-size: 12px; color: #4a4a4a; }

  .track-list::-webkit-scrollbar, .results-list::-webkit-scrollbar { width: 4px; }
  .track-list::-webkit-scrollbar-track, .results-list::-webkit-scrollbar-track { background: transparent; }
  .track-list::-webkit-scrollbar-thumb, .results-list::-webkit-scrollbar-thumb { background: #2a2a2e; border-radius: 2px; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html">&larr; Prototypes</a>
  <h1>Sonic Party</h1>
  <span class="status" id="status">Loading...</span>
</div>

<div class="main">
  <div class="left-panel">

    <div class="controls-section">
      <div class="section-label">Style filter</div>
      <div class="genre-tree" id="genre-tree"></div>
    </div>

    <div class="controls-section">
      <div class="section-label">Mood</div>
      <div class="slider-row">
        <span class="slider-label">dark</span>
        <input type="range" id="brightness" min="-100" max="100" value="0">
        <span class="slider-label" style="text-align:left">bright</span>
      </div>
      <div class="slider-row" style="margin-top: 12px;">
        <span class="slider-label">tracks</span>
        <input type="range" id="track-count" min="8" max="60" value="24">
        <span class="slider-val" id="track-count-val">24</span>
      </div>
    </div>

    <div class="curve-section">
      <div class="curve-header">
        <div class="section-label">Energy curve &mdash; draw your vibe</div>
        <div class="curve-actions">
          <button class="curve-btn" id="clear-btn">Clear</button>
          <button class="curve-btn primary" id="generate-btn">Generate playlist</button>
        </div>
      </div>
      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="curve-canvas"></canvas>
        <div class="y-labels">
          <span>max</span>
          <span>mid</span>
          <span>low</span>
        </div>
      </div>
      <div class="presets">
        <button class="preset-btn" data-preset="warmup">Warm-up</button>
        <button class="preset-btn" data-preset="peak">Peak hour</button>
        <button class="preset-btn" data-preset="wave">Wave</button>
        <button class="preset-btn" data-preset="cooldown">Cool-down</button>
        <button class="preset-btn" data-preset="journey">Full journey</button>
      </div>
    </div>
  </div>

  <div class="right-panel">
    <div class="results-header">
      <strong>Playlist</strong>
      <span class="results-count" id="results-count"></span>
    </div>
    <div class="results-list" id="results-list">
      <div class="results-empty">
        Draw an energy curve on the left<br>
        then hit Generate to build your playlist
      </div>
    </div>
  </div>
</div>

<div class="player-bar">
  <button class="player-btn" id="prev-btn">
    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
  </button>
  <button class="player-btn play-btn" id="play-btn">
    <svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <button class="player-btn" id="next-btn">
    <svg viewBox="0 0 24 24"><path d="M16 18h2V6h-2zM6 18l8.5-6L6 6z"/></svg>
  </button>
  <div class="player-track-info" id="player-info">
    <span class="player-idle">Click a track to play</span>
  </div>
  <input type="range" class="player-seek" id="seek-bar" min="0" max="100" value="0">
  <span class="player-time" id="player-time"></span>
</div>

<script>
var allTracks = [];
var playlist = [];
var currentIndex = -1;
var curvePoints = []; // normalized 0..1 values sampled across canvas width
var activeGenres = new Set();
var allGenres = [];

// --- Energy score: blend of danceable, arousal, party ---
function energyScore(t) {
  var dance = t.danceable || 0;
  var arousal = ((t.arousal || 5) - 1) / 8; // normalize 1-9 to 0-1
  var party = t.party || 0;
  return dance * 0.45 + arousal * 0.35 + party * 0.20;
}

// --- Brightness score: -1 (dark) to +1 (bright) ---
function brightnessScore(t) {
  return (t.bright || 0) - (t.dark || 0);
}

// --- Canvas drawing ---
var canvas = document.getElementById('curve-canvas');
var ctx = canvas.getContext('2d');
var wrap = document.getElementById('canvas-wrap');
var drawing = false;
var rawPoints = []; // {x, y} in canvas coords

function resizeCanvas() {
  var rect = wrap.getBoundingClientRect();
  canvas.width = rect.width * devicePixelRatio;
  canvas.height = rect.height * devicePixelRatio;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  drawCurve();
}

function drawCurve() {
  var w = canvas.width / devicePixelRatio;
  var h = canvas.height / devicePixelRatio;
  ctx.clearRect(0, 0, w, h);

  // Grid lines
  ctx.strokeStyle = '#1e1e22';
  ctx.lineWidth = 1;
  for (var i = 0; i <= 4; i++) {
    var y = (h * i) / 4;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }

  // Draw playlist energy dots if we have a playlist
  if (playlist.length > 0) {
    var step = w / playlist.length;
    for (var i = 0; i < playlist.length; i++) {
      var e = energyScore(playlist[i]);
      var px = step * i + step / 2;
      var py = h - e * h;
      ctx.beginPath();
      ctx.arc(px, py, 3, 0, Math.PI * 2);
      ctx.fillStyle = i === currentIndex ? '#c4704b' : 'rgba(196,112,75,0.35)';
      ctx.fill();
    }
  }

  if (rawPoints.length < 2) return;

  // Gradient fill under curve
  var gradient = ctx.createLinearGradient(0, 0, 0, h);
  gradient.addColorStop(0, 'rgba(196,112,75,0.20)');
  gradient.addColorStop(1, 'rgba(196,112,75,0.02)');

  ctx.beginPath();
  ctx.moveTo(rawPoints[0].x, h);
  ctx.lineTo(rawPoints[0].x, rawPoints[0].y);
  for (var i = 1; i < rawPoints.length; i++) {
    ctx.lineTo(rawPoints[i].x, rawPoints[i].y);
  }
  ctx.lineTo(rawPoints[rawPoints.length - 1].x, h);
  ctx.closePath();
  ctx.fillStyle = gradient;
  ctx.fill();

  // Curve line
  ctx.beginPath();
  ctx.moveTo(rawPoints[0].x, rawPoints[0].y);
  for (var i = 1; i < rawPoints.length; i++) {
    ctx.lineTo(rawPoints[i].x, rawPoints[i].y);
  }
  ctx.strokeStyle = '#c4704b';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function canvasCoords(e) {
  var rect = canvas.getBoundingClientRect();
  var touch = e.touches ? e.touches[0] : e;
  return {
    x: touch.clientX - rect.left,
    y: Math.max(0, Math.min(touch.clientY - rect.top, rect.height))
  };
}

canvas.addEventListener('mousedown', function(e) {
  drawing = true;
  rawPoints = [canvasCoords(e)];
  drawCurve();
});
canvas.addEventListener('mousemove', function(e) {
  if (!drawing) return;
  var p = canvasCoords(e);
  // Only add if moving forward in x
  if (rawPoints.length === 0 || p.x >= rawPoints[rawPoints.length - 1].x) {
    rawPoints.push(p);
    drawCurve();
  }
});
canvas.addEventListener('mouseup', function() { drawing = false; normalizeCurve(); });
canvas.addEventListener('mouseleave', function() { if (drawing) { drawing = false; normalizeCurve(); } });

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault(); drawing = true;
  rawPoints = [canvasCoords(e)];
  drawCurve();
}, { passive: false });
canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (!drawing) return;
  var p = canvasCoords(e);
  if (rawPoints.length === 0 || p.x >= rawPoints[rawPoints.length - 1].x) {
    rawPoints.push(p);
    drawCurve();
  }
}, { passive: false });
canvas.addEventListener('touchend', function() { drawing = false; normalizeCurve(); });

function normalizeCurve() {
  if (rawPoints.length < 2) return;
  var h = canvas.height / devicePixelRatio;
  var w = canvas.width / devicePixelRatio;
  // Sample curve into evenly-spaced energy values (0..1)
  var count = parseInt(document.getElementById('track-count').value);
  curvePoints = [];
  for (var i = 0; i < count; i++) {
    var tx = (i / (count - 1)) * w;
    // Find surrounding raw points
    var val = interpolateY(tx) / h;
    curvePoints.push(1 - val); // invert: top = high energy
  }
}

function interpolateY(tx) {
  if (!rawPoints.length) return 0;
  if (tx <= rawPoints[0].x) return rawPoints[0].y;
  if (tx >= rawPoints[rawPoints.length - 1].x) return rawPoints[rawPoints.length - 1].y;
  for (var i = 1; i < rawPoints.length; i++) {
    if (rawPoints[i].x >= tx) {
      var t = (tx - rawPoints[i-1].x) / (rawPoints[i].x - rawPoints[i-1].x);
      return rawPoints[i-1].y + t * (rawPoints[i].y - rawPoints[i-1].y);
    }
  }
  return rawPoints[rawPoints.length - 1].y;
}

// --- Presets ---
document.querySelectorAll('.preset-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var h = canvas.height / devicePixelRatio;
    var w = canvas.width / devicePixelRatio;
    var preset = btn.dataset.preset;
    rawPoints = [];
    var steps = 60;
    for (var i = 0; i <= steps; i++) {
      var t = i / steps;
      var energy;
      switch (preset) {
        case 'warmup':
          energy = 0.15 + t * 0.75;
          break;
        case 'peak':
          energy = 0.7 + Math.sin(t * Math.PI) * 0.25;
          break;
        case 'wave':
          energy = 0.5 + Math.sin(t * Math.PI * 3) * 0.35;
          break;
        case 'cooldown':
          energy = 0.9 - t * 0.7;
          break;
        case 'journey':
          // slow build, peak at 60%, gentle descent
          if (t < 0.15) energy = 0.15 + t * 2.5 * 0.3;
          else if (t < 0.6) energy = 0.45 + ((t - 0.15) / 0.45) * 0.5;
          else if (t < 0.75) energy = 0.95 - ((t - 0.6) / 0.15) * 0.15;
          else energy = 0.8 - ((t - 0.75) / 0.25) * 0.55;
          break;
      }
      rawPoints.push({ x: t * w, y: (1 - energy) * h });
    }
    drawCurve();
    normalizeCurve();
  });
});

// --- Genre hierarchy ---
function buildGenreFilters() {
  // Build tree: { parent: { sub: count, ... }, ... }
  var tree = {};
  var parentCounts = {};
  for (var i = 0; i < allTracks.length; i++) {
    var gs = allTracks[i].genre || [];
    for (var j = 0; j < gs.length; j++) {
      var raw = gs[j].toLowerCase();
      var parts = raw.split('---');
      var parent = parts[0].trim();
      var child = parts.length > 1 ? parts[1].trim() : null;
      if (!tree[parent]) tree[parent] = {};
      parentCounts[parent] = (parentCounts[parent] || 0) + 1;
      if (child) {
        tree[parent][child] = (tree[parent][child] || 0) + 1;
      }
    }
  }

  // Sort parents by count
  var parents = Object.keys(tree).sort(function(a, b) {
    return (parentCounts[b] || 0) - (parentCounts[a] || 0);
  });

  // Filter out tiny categories
  parents = parents.filter(function(p) { return (parentCounts[p] || 0) >= 3; });

  var container = document.getElementById('genre-tree');
  container.innerHTML = parents.map(function(p) {
    var children = Object.keys(tree[p]).sort(function(a, b) { return tree[p][b] - tree[p][a]; });
    // Only keep subcategories with 3+ tracks
    children = children.filter(function(c) { return tree[p][c] >= 3; });
    var childHtml = children.map(function(c) {
      return '<button class="genre-btn" data-genre="' + p + '---' + c + '">' + c +
        ' <span style="opacity:0.4">' + tree[p][c] + '</span></button>';
    }).join('');

    return '<div class="genre-group">' +
      '<button class="genre-parent" data-parent="' + p + '">' +
        '<span class="arrow">&#9654;</span>' +
        '<span class="gp-name">' + p + '</span>' +
        '<span class="gp-count">' + (parentCounts[p] || 0) + '</span>' +
      '</button>' +
      (children.length ? '<div class="genre-children" data-parent="' + p + '">' + childHtml + '</div>' : '') +
    '</div>';
  }).join('');

  // Parent click: toggle expand + select all of that parent
  container.querySelectorAll('.genre-parent').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var p = btn.dataset.parent;
      var childPanel = container.querySelector('.genre-children[data-parent="' + p + '"]');
      var isExpanded = btn.classList.contains('expanded');

      if (isExpanded) {
        // Collapse: deselect parent and all its children
        btn.classList.remove('expanded', 'active');
        if (childPanel) childPanel.classList.remove('open');
        // Remove all genres matching this parent
        var toRemove = [];
        activeGenres.forEach(function(g) {
          if (g === p || g.startsWith(p + '---')) toRemove.push(g);
        });
        toRemove.forEach(function(g) { activeGenres.delete(g); });
        if (childPanel) {
          childPanel.querySelectorAll('.genre-btn').forEach(function(b) { b.classList.remove('active'); });
        }
      } else {
        // Expand: select all of this parent
        btn.classList.add('expanded', 'active');
        if (childPanel) {
          childPanel.classList.add('open');
          // Select all children by default
          childPanel.querySelectorAll('.genre-btn').forEach(function(b) {
            b.classList.add('active');
            activeGenres.add(b.dataset.genre);
          });
        }
        activeGenres.add(p);
      }
      updateParentState(p);
    });
  });

  // Child click: toggle individual subcategory
  container.querySelectorAll('.genre-btn').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var g = btn.dataset.genre;
      if (activeGenres.has(g)) {
        activeGenres.delete(g);
        btn.classList.remove('active');
      } else {
        activeGenres.add(g);
        btn.classList.add('active');
      }
      // Update parent active state
      var parent = g.split('---')[0];
      updateParentState(parent);
    });
  });
}

function updateParentState(parent) {
  var container = document.getElementById('genre-tree');
  var parentBtn = container.querySelector('.genre-parent[data-parent="' + parent + '"]');
  var childPanel = container.querySelector('.genre-children[data-parent="' + parent + '"]');
  if (!parentBtn || !childPanel) return;

  var anyActive = false;
  childPanel.querySelectorAll('.genre-btn').forEach(function(b) {
    if (activeGenres.has(b.dataset.genre)) anyActive = true;
  });
  parentBtn.classList.toggle('active', anyActive);
}

// --- Generate playlist ---
function generatePlaylist() {
  if (curvePoints.length < 2) return;

  var brightPref = parseInt(document.getElementById('brightness').value) / 100; // -1..+1

  // Filter by genre (match full tag or parent category)
  var pool = allTracks;
  if (activeGenres.size > 0) {
    pool = allTracks.filter(function(t) {
      var gs = (t.genre || []).map(function(g) { return g.toLowerCase(); });
      for (var j = 0; j < gs.length; j++) {
        if (activeGenres.has(gs[j])) return true;
        // Also match if parent category is selected
        var parent = gs[j].split('---')[0].trim();
        if (activeGenres.has(parent)) return true;
      }
      return false;
    });
  }

  if (pool.length === 0) {
    document.getElementById('results-list').innerHTML = '<div class="results-empty">No tracks match these filters</div>';
    return;
  }

  // Pre-compute scores
  var scored = pool.map(function(t) {
    return { track: t, energy: energyScore(t), brightness: brightnessScore(t) };
  });

  // For each curve point, find best matching track
  var used = new Set();
  playlist = [];

  for (var i = 0; i < curvePoints.length; i++) {
    var targetEnergy = curvePoints[i];
    var bestScore = Infinity;
    var bestTrack = null;

    for (var j = 0; j < scored.length; j++) {
      var s = scored[j];
      if (used.has(j)) continue;

      // Energy distance (primary)
      var eDist = Math.abs(s.energy - targetEnergy);

      // Brightness preference bonus
      var bBonus = 0;
      if (brightPref !== 0) {
        // Higher brightness score = more bright. If brightPref > 0 we want bright tracks
        bBonus = -brightPref * s.brightness * 0.15;
      }

      var total = eDist + bBonus;
      if (total < bestScore) {
        bestScore = total;
        bestTrack = j;
      }
    }

    if (bestTrack !== null) {
      used.add(bestTrack);
      playlist.push(scored[bestTrack].track);
    }
  }

  currentIndex = -1;
  renderResults();
  drawCurve();
}

document.getElementById('generate-btn').addEventListener('click', generatePlaylist);

// --- Clear ---
document.getElementById('clear-btn').addEventListener('click', function() {
  rawPoints = [];
  curvePoints = [];
  playlist = [];
  currentIndex = -1;
  drawCurve();
  document.getElementById('results-list').innerHTML = '<div class="results-empty">Draw an energy curve on the left<br>then hit Generate to build your playlist</div>';
  document.getElementById('results-count').textContent = '';
});

// Track count slider
var trackCountSlider = document.getElementById('track-count');
trackCountSlider.addEventListener('input', function() {
  document.getElementById('track-count-val').textContent = trackCountSlider.value;
});
trackCountSlider.addEventListener('change', function() {
  normalizeCurve();
});

// --- Render playlist ---
function renderResults() {
  var container = document.getElementById('results-list');
  document.getElementById('results-count').textContent = playlist.length + ' tracks';

  if (!playlist.length) {
    container.innerHTML = '<div class="results-empty">No tracks matched the curve</div>';
    return;
  }

  container.innerHTML = playlist.map(function(t, i) {
    var e = energyScore(t);
    var genres = (t.genre || []).slice(0, 2);
    var barCount = 5;
    var bars = '';
    for (var b = 0; b < barCount; b++) {
      var h = Math.max(2, (e * 20) * (0.5 + Math.random() * 0.5));
      bars += '<div class="energy-pip" style="height:' + h + 'px"></div>';
    }
    return '<div class="result-row' + (i === currentIndex ? ' playing' : '') + '" data-idx="' + i + '">' +
      '<span class="result-num">' + (i + 1) + '</span>' +
      '<div class="result-info">' +
        '<div class="result-title">' + esc(t.title) + '</div>' +
        '<div class="result-meta">' + esc(t.artist) + ' &middot; ' + esc(t.album) + '</div>' +
      '</div>' +
      '<div class="result-tags">' + genres.map(function(g) {
        return '<span class="result-tag">' + esc(g) + '</span>';
      }).join('') + '</div>' +
      '<div class="result-energy-bar">' + bars + '</div>' +
    '</div>';
  }).join('');

  container.querySelectorAll('.result-row').forEach(function(row) {
    row.addEventListener('click', function() { playIndex(parseInt(row.dataset.idx)); });
  });
}

// --- Audio ---
var audio = new Audio();
audio.addEventListener('ended', function() { playIndex(currentIndex + 1); });
var seeking = false;
var seekBar = document.getElementById('seek-bar');
seekBar.addEventListener('mousedown', function() { seeking = true; });
seekBar.addEventListener('touchstart', function() { seeking = true; });
seekBar.addEventListener('change', function() {
  if (audio.duration) audio.currentTime = (seekBar.value / 100) * audio.duration;
  seeking = false;
});
audio.addEventListener('timeupdate', function() {
  var el = document.getElementById('player-time');
  if (!audio.duration) { el.textContent = ''; return; }
  if (!seeking) seekBar.value = (audio.currentTime / audio.duration) * 100;
  el.textContent = fmtTime(audio.currentTime) + ' / ' + fmtTime(audio.duration);
});
audio.addEventListener('play', updatePlayIcon);
audio.addEventListener('pause', updatePlayIcon);

function fmtTime(s) { return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0'); }

function updatePlayIcon() {
  document.getElementById('play-icon').innerHTML = audio.paused
    ? '<path d="M8 5v14l11-7z"/>'
    : '<path d="M6 19h4V5H6zm8-14v14h4V5z"/>';
}

function playIndex(idx) {
  if (!playlist.length) return;
  if (idx < 0) idx = 0;
  if (idx >= playlist.length) { audio.pause(); return; }
  currentIndex = idx;
  var t = playlist[idx];
  audio.src = '/music/' + encodeURI(t.file.replace(/.*\/music\//, ''));
  audio.play();
  document.getElementById('player-info').innerHTML =
    '<div class="player-track-title">' + esc(t.title) + '</div>' +
    '<div class="player-track-meta">' + esc(t.artist) + ' &middot; ' + esc(t.album) + '</div>';
  document.querySelectorAll('.result-row').forEach(function(r, i) { r.classList.toggle('playing', i === idx); });
  drawCurve();
}

document.getElementById('play-btn').addEventListener('click', function() {
  if (!audio.src) { playIndex(0); return; }
  audio.paused ? audio.play() : audio.pause();
});
document.getElementById('prev-btn').addEventListener('click', function() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  playIndex(currentIndex - 1);
});
document.getElementById('next-btn').addEventListener('click', function() { playIndex(currentIndex + 1); });

function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

// --- Init ---
async function init() {
  try {
    var res = await fetch('/api/tracks');
    var data = await res.json();
    allTracks = Array.isArray(data) ? data : (data.tracks || []);
    document.getElementById('status').textContent = allTracks.length + ' tracks';
    buildGenreFilters();
    resizeCanvas();
  } catch(e) {
    document.getElementById('status').textContent = 'Failed to load';
  }
}

window.addEventListener('resize', resizeCanvas);
init();
</script>
